# PostgreSQL Security Configuration
# These settings override defaults for improved security and auditing

# Authentication & Connection Security
listen_addresses = 'localhost'
max_connections = 100

# Logging for Security Auditing
log_connections = on
log_disconnections = on
log_duration = on
log_statement = 'ddl'
log_line_prefix = '%m [%p] %q%u@%d '

# Password Encryption
password_encryption = scram-sha-256

# SSL Configuration (enable when deploying outside internal networks)
# ssl = on
# ssl_cert_file = '/etc/ssl/certs/server.crt'
# ssl_key_file = '/etc/ssl/private/server.key'

# Data Protection
log_checkpoints = on
log_lock_waits = on
log_temp_files = 0
